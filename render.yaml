# Render Blueprint for the JobGraph API.
# 1. Push this repo to GitHub.
# 2. In Render: New > Blueprint, connect the repo.
# 3. Set the COGNODB_* secret env vars when prompted (Render injects PORT itself).
services:
  - type: web
    name: jobgraph-server
    runtime: node
    rootDir: server
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: COGNODB_URI
        sync: false # set in the Render dashboard
      - key: COGNODB_USERNAME
        sync: false
      - key: COGNODB_PASSWORD
        sync: false
      - key: CLIENT_ORIGIN
        sync: false # comma-separated list of allowed browser origins (your Vercel URL)
