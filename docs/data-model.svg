<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" font-family="Inter, system-ui, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="900" height="460" rx="16" fill="#ffffff"/>
  <text x="450" y="34" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">JobGraph data model</text>

  <!-- Row 1: Company, Job, Location -->
  <g>
    <rect x="70"  y="70"  width="160" height="56" rx="12" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/>
    <text x="150" y="94" text-anchor="middle" font-size="14" font-weight="700" fill="#4c1d95">Company</text>
    <text x="150" y="112" text-anchor="middle" font-size="11" fill="#7c3aed">id · name · website · logo</text>

    <rect x="370" y="70"  width="160" height="56" rx="12" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
    <text x="450" y="94" text-anchor="middle" font-size="14" font-weight="700" fill="#312e81">Job</text>
    <text x="450" y="112" text-anchor="middle" font-size="11" fill="#4f46e5">title · salary · remote · level</text>

    <rect x="670" y="70"  width="160" height="56" rx="12" fill="#f0f9ff" stroke="#0ea5e9" stroke-width="2"/>
    <text x="750" y="94" text-anchor="middle" font-size="14" font-weight="700" fill="#0c4a6e">Location</text>
    <text x="750" y="112" text-anchor="middle" font-size="11" fill="#0284c7">city · state · country</text>
  </g>

  <!-- Row 2: Industry, Skill, Technology -->
  <g>
    <rect x="70"   y="300" width="160" height="56" rx="12" fill="#fff1f2" stroke="#f43f5e" stroke-width="2"/>
    <text x="150" y="324" text-anchor="middle" font-size="14" font-weight="700" fill="#881337">Industry</text>
    <text x="150" y="342" text-anchor="middle" font-size="11" fill="#e11d48">id · name</text>

    <rect x="370" y="300" width="160" height="56" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
    <text x="450" y="324" text-anchor="middle" font-size="14" font-weight="700" fill="#064e3b">Skill</text>
    <text x="450" y="342" text-anchor="middle" font-size="11" fill="#059669">id · name · category</text>

    <rect x="670" y="300" width="160" height="56" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
    <text x="750" y="324" text-anchor="middle" font-size="14" font-weight="700" fill="#78350f">Technology</text>
    <text x="750" y="342" text-anchor="middle" font-size="11" fill="#d97706">id · name · category</text>
  </g>

  <!-- Relationships -->
  <g stroke="#64748b" stroke-width="1.6" fill="none" marker-end="url(#arrow)">
    <!-- Job -> Skill -->
    <path d="M 450 126 L 450 296"/>
    <text x="462" y="215" font-size="11" fill="#059669" stroke="none" font-weight="600">REQUIRES</text>

    <!-- Job -> Technology (curved) -->
    <path d="M 526 116 C 610 150, 660 210, 690 296" />
    <text x="660" y="195" font-size="11" fill="#d97706" stroke="none" font-weight="600">USES_TECH</text>

    <!-- Job -> Company (curved) -->
    <path d="M 374 116 C 290 150, 240 210, 210 296" />
    <text x="180" y="195" font-size="11" fill="#7c3aed" stroke="none" font-weight="600">POSTED_BY</text>

    <!-- Company -> Industry -->
    <path d="M 150 126 L 150 296"/>
    <text x="160" y="215" font-size="11" fill="#e11d48" stroke="none" font-weight="600">IN_INDUSTRY</text>

    <!-- Skill self-loop (RELATED_TO) -->
    <path d="M 530 320 C 610 300, 610 356, 530 336" stroke="#14b8a6"/>
    <text x="600" y="352" font-size="11" fill="#0d9488" stroke="none" font-weight="600">RELATED_TO</text>

    <!-- Technology self-loop (RELATED_TO) -->
    <path d="M 670 320 C 590 300, 590 356, 670 336" stroke="#14b8a6"/>
    <text x="598" y="352" font-size="11" fill="#0d9488" stroke="none" font-weight="600">RELATED_TO</text>
  </g>

  <!-- Location link: Job -> Location -->
  <path d="M 574 116 C 650 150, 700 200, 720 290" stroke="#64748b" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
  <text x="700" y="170" font-size="11" fill="#0284c7" font-weight="600">LOCATED_IN</text>

  <text x="450" y="420" text-anchor="middle" font-size="11" fill="#94a3b8">Every node has a unique id. All six labels have a uniqueness constraint on id; the seed script uses MERGE so it can run repeatedly.</text>
  <text x="450" y="442" text-anchor="middle" font-size="11" fill="#94a3b8">Typed relationships: (:Job)-[:REQUIRES]->(:Skill) · (:Job)-[:USES_TECH]->(:Technology) · (:Job)-[:POSTED_BY]->(:Company) · (:Job)-[:LOCATED_IN]->(:Location) · (:Company)-[:IN_INDUSTRY]->(:Industry) · (:Skill)-[:RELATED_TO]->(:Skill) · (:Technology)-[:RELATED_TO]->(:Technology)</text>
</svg>
